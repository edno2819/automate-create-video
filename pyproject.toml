# Dependências do servidor de vídeos (web, trabalhador e scripts de ferramentas/).
#
# Não é uma biblioteca: o código roda a partir da raiz do repositório (PYTHONPATH=.), por isso não há pacote a
# empacotar. Instale só as dependências:
#
#     uv venv --python 3.12 .venv
#     uv pip install --python .venv/bin/python -r pyproject.toml --extra dev
#
# Python 3.12 porque o faster-whisper (ferramentas/producao/alinhar.py) ainda não roda no 3.13+.

[project]
name = "story-automate-youtube"
version = "0.2.0"
description = "Automação de vídeos para o YouTube com agentes de LLM: do pedido ao vídeo montado, num servidor só com chaves de API."
requires-python = ">=3.12,<3.13"
dependencies = [
    # banco e armazenamento
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "boto3>=1.34",
    "cryptography>=42",
    "jsonschema>=4.21",
    # servidor web
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    # pedido (YAML 1.2)
    "ruamel.yaml>=0.18",
    # alinhamento da narração
    "faster-whisper>=1.1",
    "numpy",
    # pesquisa no YouTube e transcrições
    "yt-dlp",
    "youtube-transcript-api>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

# Nada a empacotar: `pip install -e .` só instala as dependências.
[tool.setuptools]
packages = []
py-modules = []

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
