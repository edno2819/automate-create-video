# Migrações do banco (Alembic). O endereço do banco vem de DATABASE_URL (nucleo/config.py), não daqui.
#
#   alembic upgrade head          # cria ou atualiza o esquema (o deploy/entrypoint.sh faz isto)
#   alembic revision -m "..."     # nova migração em nucleo/banco/migracoes/versions/
#   alembic check                 # o banco migrado bate com nucleo/banco/modelos.py?

[alembic]
script_location = %(here)s/nucleo/banco/migracoes
prepend_sys_path = %(here)s
path_separator = os
# vazio: o env.py usa DATABASE_URL
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
